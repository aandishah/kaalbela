<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaalbela</title>
<style>
  :root {
    --bg: #0b0d10;
    --fg: #f2f0ea;
    --accent: #d98e4a;
    --muted: #8a8f98;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .wrap {
    max-width: 560px;
  }
  h1 {
    font-size: clamp(2.2rem, 6vw, 3.5rem);
    letter-spacing: 0.02em;
    margin: 0 0 12px;
    font-weight: 600;
  }
  p {
    color: var(--muted);
    font-size: 1.05rem;
    line-height: 1.6;
    margin: 0 0 28px;
  }
  .badge {
    display: inline-block;
    padding: 6px 14px;
    border: 1px solid var(--accent);
    color: var(--accent);
    border-radius: 999px;
    font-size: 0.8rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="wrap">
    <span class="badge">Coming soon</span>
    <h1>Kaalbela</h1>
    <p>This page is a placeholder. Content is on the way.</p>
  </div>
</body>
</html>
